<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID LANCER // FIRST SORTIE</title>
  
  <!-- Modern UI Dependencies -->
  <link rel="stylesheet" href="../css/modern.css">
  
  <style>
    :root {
      --clr-arcade-bg: #050812;
      --clr-arcade-panel: rgba(11, 23, 48, 0.95);
      --clr-arcade-border: rgba(0, 229, 255, 0.3);
      --clr-arcade-glow: rgba(0, 229, 255, 0.1);
    }

    body {
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      padding-block: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: center;
      background-color: var(--clr-bg);
      font-family: var(--font-body);
      color: var(--clr-text);
      background: radial-gradient(circle at center, #0a0e1a 0%, #030008 100%);
    }

    /* Arcade Box Wrapper */
    .arcade-machine {
      position: relative;
      box-sizing: border-box;
      width: min(95%, 1156px);
      padding: 24px;
      background: linear-gradient(180deg, #1a1f2c 0%, #0b0e14 100%);
      border: 4px solid #2a3142;
      border-radius: 12px;
      box-shadow: 
        0 0 0 2px #111,
        0 20px 50px rgba(0,0,0,0.8),
        inset 0 0 40px rgba(0,229,255,0.05);
    }

    .arcade-machine::before {
      content: '';
      position: absolute;
      top: -10px; left: 50%;
      transform: translateX(-50%);
      width: min(200px, 100%); height: 4px;
      background: var(--clr-cerulean);
      box-shadow: 0 0 15px var(--clr-cerulean);
      border-radius: 2px;
    }

    .screen-container {
      position: relative;
      box-sizing: border-box;
      width: min(100%, var(--cabinet-screen-limit, 100%));
      margin-inline: auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #000;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 16 / 9;
    }

    .arcade-machine:fullscreen {
      --cabinet-screen-limit: max(216px, calc((100vh - 192px) * 16 / 9));
      overflow: auto;
    }

    /* CRT Scanline Overlay */
    .screen-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      opacity: 0.3;
    }

    #game-root canvas {
      max-width: 100%;
      height: auto !important;
      display: block;
    }

    .arcade-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .arcade-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      margin: 0;
      text-shadow: 0 0 10px rgba(0,229,255,0.5);
    }

    .arcade-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-arcade {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,229,255,0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .btn-arcade:not(:disabled):hover {
      background: rgba(0,229,255,0.1);
      border-color: var(--clr-cerulean);
      box-shadow: 0 0 10px rgba(0,229,255,0.2);
    }

    .btn-arcade:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .touch-station {
      display: none;
    }

    /* Landscape-only floating stick: the portrait pad keeps its own station. */
    .landscape-stick {
      display: none;
    }

    @media (any-pointer: coarse) {
      .playfield[data-touch-ready] {
        --touch-pad-size: clamp(100px, 32vw, 136px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-areas: "screen screen" "move right";
        align-items: center;
        gap: 10px;
      }

      .playfield[data-touch-ready] .screen-container {
        grid-area: screen;
      }

      .playfield[data-touch-ready] .touch-station {
        display: grid;
        place-items: center;
        gap: 4px;
      }

      .touch-move { grid-area: move; justify-self: start; }
      .touch-right { grid-area: right; justify-self: end; }

      .touch-caption {
        color: #9fb2cc;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .touch-pad, .touch-button {
        box-sizing: border-box;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .touch-pad {
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        place-items: stretch;
        padding: 4px;
        width: var(--touch-pad-size);
        aspect-ratio: 1;
        border: 1px solid var(--clr-arcade-border);
        border-radius: 14px;
        background: var(--clr-arcade-panel);
        color: #a9d5e8;
        font: bold 1.35rem/1 system-ui, sans-serif;
      }

      .touch-pad[aria-disabled="true"] { opacity: 0.55; }

      .touch-pad span {
        display: grid;
        place-items: center;
        border-radius: 5px;
        background: rgba(0, 229, 255, 0.08);
        pointer-events: none;
      }

      .touch-up { grid-area: 1 / 2; }
      .touch-left { grid-area: 2 / 1; }
      .touch-center { grid-area: 2 / 2; }
      .touch-right-arrow { grid-area: 2 / 3; }
      .touch-down { grid-area: 3 / 2; }

      .touch-pad[data-directions~="moveUp"] .touch-up,
      .touch-pad[data-directions~="moveLeft"] .touch-left,
      .touch-pad[data-directions~="moveRight"] .touch-right-arrow,
      .touch-pad[data-directions~="moveDown"] .touch-down,
      .btn-arcade.touch-button[data-firing] {
        background: var(--clr-cerulean);
        color: #07111f;
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
      }

      .touch-button {
        width: var(--touch-pad-size);
        min-height: 52px;
        padding: 8px;
        font-weight: bold;
      }

      #touchFire {
        width: min(88px, var(--touch-pad-size));
        aspect-ratio: 1;
        border-radius: 50%;
        border-width: 2px;
      }

      #touchStart {
        background: #71e7ff;
        color: #07111f;
      }

      .touch-button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
    }

    .arcade-footer {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      justify-content: space-between;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-link {
      color: var(--clr-cerulean);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Optional pilot setup (kept between the playfield and the footer) */
    .pilot-setup {
      margin-top: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      background: var(--clr-arcade-panel);
      color: #fff;
      font-family: var(--font-body);
    }

    .pilot-setup-summary {
      cursor: pointer;
      padding: 6px 10px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--clr-cerulean);
    }

    .pilot-setup-summary:focus-visible {
      outline: 2px solid var(--clr-cerulean);
      outline-offset: -2px;
      border-radius: 4px;
    }

    .pilot-setup-hint {
      margin-left: 8px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
    }

    .pilot-setup-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 10px 10px;
    }

    .pilot-setup-note {
      margin: 0;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.55);
    }

    .pilot-setup-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    .pilot-field {
      display: flex;
      flex: 1 1 200px;
      min-width: 0;
      flex-direction: column;
      gap: 4px;
    }

    .pilot-field-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9fb2cc;
    }

    .pilot-control {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--clr-arcade-border);
      border-radius: 4px;
      background: #07111f;
      color: #eef5ff;
      font: inherit;
      font-size: 0.85rem;
      color-scheme: dark;
    }

    .pilot-control:focus-visible {
      outline: 2px solid var(--clr-cerulean);
      outline-offset: 1px;
    }

    .pilot-address {
      margin: 0;
      font-size: 0.8rem;
      color: var(--clr-cerulean);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .arcade-machine {
        padding: 12px;
        border-width: 2px;
      }
      .arcade-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }

    @media (max-height: 600px) {
      .arcade-machine {
        /* Leave room for cabinet controls; very short windows can still scroll. */
        --cabinet-screen-limit: max(216px, calc((100vh - 192px) * 16 / 9));
      }
      .arcade-header {
        margin-bottom: 8px;
        padding-bottom: 8px;
      }
      .arcade-footer {
        margin-top: 8px;
      }
      .pilot-setup {
        margin-top: 8px;
      }
    }

    /* Landscape playtest (coarse pointers only): the cabinet chrome steps
       aside so the playfield can fill the safe viewport at its largest
       uncropped 16:9. Desktop, portrait and touch laptops keep the cabinet. */
    @media (any-pointer: coarse) and (orientation: landscape) and (max-height: 600px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        padding: 0;
        background: #010208;
      }

      .arcade-machine, .arcade-machine:fullscreen {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        border: 0;
        border-radius: 0;
        overflow: hidden;
        background: #010208;
        box-shadow: none;
      }

      .arcade-machine::before,
      .arcade-header,
      .pilot-setup,
      .arcade-footer {
        display: none;
      }

      /* The play layout is CSS-only on purpose: Phaser measures its parent
         during boot, before the scene can mark the playfield touch-ready, so
         the size it measures has to already be the size it keeps. The second
         selector keeps the pre-touch-ready paint identical to the one after it. */
      .playfield[data-touch-ready],
      .playfield {
        position: absolute;
        inset: 0;
        inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Widest 16:9 that fits the safe area: never cropped, never scrolling.
         The vh line is the fallback for viewports without dynamic units, so
         they size the same way instead of dropping to the cabinet limit. */
      .playfield .screen-container {
        width: min(100%, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
        width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9));
        /* Black on black: the border only shrank the play area off 16:9. */
        border: 0;
      }

      #game-root {
        width: 100%;
      }

      .playfield[data-touch-ready] .touch-move {
        display: none;
      }

      /* Floating stick, inset from the corner it sits in and drawn over the
         peripheral play space only: a faint ring at rest, cyan while dragged. */
      .playfield[data-touch-ready] .landscape-stick {
        display: block;
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 3;
        width: clamp(128px, 34vh, 168px);
        aspect-ratio: 1;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .landscape-stick-ring,
      .landscape-stick-knob {
        position: absolute;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
      }

      .landscape-stick-ring {
        box-sizing: border-box;
        width: 92px; /* Half of it is the stickReach the input code uses. */
        height: 92px;
        left: var(--stick-ox, 50%);
        top: var(--stick-oy, 50%);
        border: 2px solid rgba(0, 229, 255, 0.4);
        opacity: 0.5;
      }

      .landscape-stick-knob {
        box-sizing: border-box;
        width: 34px;
        height: 34px;
        left: calc(var(--stick-ox, 50%) + var(--stick-kx, 0px));
        top: calc(var(--stick-oy, 50%) + var(--stick-ky, 0px));
        border: 1px solid rgba(0, 229, 255, 0.55);
        background: rgba(0, 229, 255, 0.16);
      }

      .landscape-stick[data-active] .landscape-stick-ring {
        opacity: 1;
        border-color: rgba(0, 229, 255, 0.9);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.35), inset 0 0 14px rgba(0, 229, 255, 0.12);
      }

      .landscape-stick[data-active] .landscape-stick-knob {
        border-color: #71e7ff;
        background: rgba(113, 231, 255, 0.5);
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.45);
      }

      .landscape-stick[aria-disabled="true"] {
        opacity: 0.4;
      }

      .playfield[data-touch-ready] .touch-right {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 3;
      }

      .playfield[data-touch-ready] #touchFire {
        box-sizing: border-box;
        width: 64px;
        height: 64px;
        min-height: 0;
        padding: 0;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        background: rgba(6, 15, 30, 0.62);
        border: 2px solid rgba(0, 229, 255, 0.75);
        color: #eefbff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        box-shadow: inset 0 0 0 1px rgba(255, 150, 60, 0.3), 0 0 10px rgba(0, 229, 255, 0.18);
      }

      .playfield[data-touch-ready] #touchFire[data-firing],
      .playfield[data-touch-ready] #touchFire:active {
        background: var(--clr-cerulean);
        border-color: #ff9d4d;
        color: #07111f;
        text-shadow: none;
        transform: scale(0.94);
        box-shadow: inset 0 0 0 1px rgba(255, 157, 77, 0.6), 0 0 16px rgba(0, 229, 255, 0.5);
      }

      /* The overlay action keeps a real, focusable button clear of the
         in-canvas Start/Continue/Retry CTA at the centre of the screen. */
      .playfield[data-touch-ready] #touchStart {
        box-sizing: border-box;
        width: auto;
        min-width: 148px;
        min-height: 48px;
        padding: 10px 18px;
        background: #71e7ff;
        color: #07111f;
        border-color: #71e7ff;
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.45);
      }

      .playfield[data-touch-ready] #touchStart:active {
        transform: scale(0.96);
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.65);
      }
    }
  </style>
</head>
<body>
  <div class="arcade-machine" id="appShell">
    <div class="arcade-header">
      <div class="brand-zone">
        <h1 class="arcade-title">Void Lancer</h1>
        <div style="font-size: 0.7rem; color: var(--clr-cerulean); opacity: 0.8;">SORTIE V1.0 // ANISIAN CONVERGENCE</div>
      </div>
      <div class="arcade-controls">
        <button class="btn-arcade" id="soundToggleBtn">Audio: On</button>
        <button class="btn-arcade" id="fullscreenBtn">Full Screen</button>
      </div>
    </div>

    <div class="playfield" id="playfield">
      <div class="screen-container">
        <div id="game-root"></div>
      </div>
      <div class="touch-station touch-move">
        <div class="touch-pad" id="touchPad" role="group" aria-label="Movement pad: touch and slide in any direction">
          <span class="touch-up" aria-hidden="true">▲</span>
          <span class="touch-left" aria-hidden="true">◀</span>
          <span class="touch-center" aria-hidden="true">•</span>
          <span class="touch-right-arrow" aria-hidden="true">▶</span>
          <span class="touch-down" aria-hidden="true">▼</span>
        </div>
        <div class="touch-caption" aria-hidden="true">Move</div>
      </div>
      <div class="touch-station touch-right">
        <button class="btn-arcade touch-button" id="touchFire" type="button" aria-label="Hold to fire" tabindex="-1" hidden>Fire</button>
        <button class="btn-arcade touch-button" id="touchStart" type="button" hidden>Start Sortie</button>
      </div>
      <div class="landscape-stick" id="touchStick" role="group" aria-label="Movement stick: touch and slide in any direction">
        <span class="landscape-stick-ring" aria-hidden="true"></span>
        <span class="landscape-stick-knob" aria-hidden="true"></span>
      </div>
    </div>

    <details class="pilot-setup" id="pilotSetup">
      <summary class="pilot-setup-summary">Pilot Setup <span class="pilot-setup-hint">Optional</span></summary>
      <div class="pilot-setup-body">
        <p class="pilot-setup-note">Optional. Nothing is saved or sent, and no name is needed to launch.</p>
        <div class="pilot-setup-fields">
          <label class="pilot-field">
            <span class="pilot-field-label">Rank</span>
            <select class="pilot-control" id="pilotRank">
              <option value="">No rank selected</option>
              <optgroup label="US Navy">
                <option value="navy-ensign">Ensign</option>
                <option value="navy-lieutenant-junior-grade">Lieutenant Junior Grade</option>
                <option value="navy-lieutenant">Lieutenant</option>
                <option value="navy-lieutenant-commander">Lieutenant Commander</option>
                <option value="navy-commander">Commander</option>
                <option value="navy-captain">Captain</option>
              </optgroup>
              <optgroup label="US Space Force">
                <option value="space-force-second-lieutenant">Second Lieutenant</option>
                <option value="space-force-first-lieutenant">First Lieutenant</option>
                <option value="space-force-captain">Captain</option>
                <option value="space-force-major">Major</option>
                <option value="space-force-lieutenant-colonel">Lieutenant Colonel</option>
                <option value="space-force-colonel">Colonel</option>
              </optgroup>
            </select>
          </label>
          <label class="pilot-field">
            <span class="pilot-field-label">Surname</span>
            <input class="pilot-control" type="text" id="pilotSurname" autocomplete="family-name" maxlength="40" spellcheck="false">
          </label>
        </div>
        <p class="pilot-address" id="pilotAddress" aria-live="polite">Standing by, Pilot.</p>
      </div>
    </details>

    <div class="arcade-footer">
      <div>Default controls: WASD/Arrows to Move • Space/J/K to Fire or Start</div>
      <a href="/" class="back-link">← Return to Station</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./js/phaser.min.js"></script>
  <script src="./js/level1_stage_data.js"></script>
  <script src="./js/level2_stage_data.js?v=2"></script>
  <script src="./js/graveyard-sortie.js?v=1"></script>
  <script src="./js/controls.js?v=3"></script>
  <script src="./js/main.js?v=9"></script>
  <script src="./js/pilot-setup.js?v=1"></script>
</body>
</html>
